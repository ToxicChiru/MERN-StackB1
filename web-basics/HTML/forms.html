<!DOCTYPE html>
<html>
    <head>
        <title>Forms Example</title>
    </head>
    <body>
        <form>
            <label>Name: </label>
            <input type="text">
            <br><br>
            <label>Email: </label>
            <input type="email">
            <br><br>
            <label>Password: </label>
            <input type="password">   
            <br><br>
            Gender:
            <input type="radio" name="a"> Male
            <input type="radio" name="a"> Female
            <br><br>
            Skills:
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> JS
            <input type="checkbox"> MERN
            <br><br>
            <input type="submit">
        </form>
    </body>
</html>
