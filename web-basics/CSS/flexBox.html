<!DOCTYPE html>
<html>
    <head>
        <title>FlexBox</title>
        <style>
            .container{
                display: flex;
                flex-direction: column;
                background-color: aqua;
            }

            .container div{
                background-color: chartreuse;
                margin: 10px;
                padding:20px;
                font-size: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
            <div>Item 4</div>
            <div>Item 5</div>
        </div>
    </body>
</html>
